
<app-current-data [parentRef]="this"></app-current-data>
<app-hourly-data></app-hourly-data>
<app-skysense></app-skysense>
<app-satellite-image></app-satellite-image>
<app-weather-news [weatherNewsHeaderConfig]="weatherNewsHeaderConfig"></app-weather-news>
<div #videoContainer style="min-height: 400px;">
  <ng-container *ngIf="showVideo">
    <app-videos></app-videos>
  </ng-container>
</div>



<div class="image-container" *ngIf="isOverlayVisible">
  <div class="image-wrapper">
    <img [src]="selectedImage" alt="Preview Image" />
</div>

  <div class="button-wrapper" *ngIf="dataService.getDeviceType() == 'mobile'">
    <button class="setting" (click)="goToSetting()">Go to setting</button>
  </div>

  <button class="close-btn" (click)="closeOverlay()">×</button>
</div>
