
      <div class="updates">
      <div class="container">
        <div class="update_heading">
          <h5>{{weatherNewsHeaderConfig && weatherNewsHeaderConfig.title | translate}}</h5>
          <ul *ngIf="weatherNewsHeaderConfig && weatherNewsHeaderConfig.isLanguagesSelecter">
            <li class="active" (click)="onLanguageChange('english')">English</li>
            <li (click)="onLanguageChange('Hindi')">Hindi</li>
          </ul>

        <div *ngIf="weatherNewsHeaderConfig && weatherNewsHeaderConfig.isHeaderView">
          <div class="btn">
            <button>{{'View More' | translate}}</button>
          </div>
        </div>
        </div>
        <div class="main_content">
          <div class="update_content" *ngFor="let item of weatherNews"  [routerLink]="['/content', item.categorySlug[0], item.titleSlug]">
            <a  [routerLink]="['/content', item.categorySlug[0], item.titleSlug]">
              <div class="image">
                <img [src]="item.thumbnail" alt="" />
              </div>
         
                 <p>{{item.title}}</p>
            
              <div class="date">
            <span>{{dataService.formatDateTrending(item.DateTime)}}</span>
                <img src="https://skymetweather.com/img/whatapp.png" alt="" style="z-index: 9999;"/>
              </div>
            </a>
          </div>

         
        </div>
        <div routerLink="/news-list/weather-news-and-analysis"
        class="btn_center" *ngIf="weatherNewsHeaderConfig && weatherNewsHeaderConfig.isFooterView">
          <div class="btn">
            <button>{{'View More' | translate}}</button>
          </div>
        </div>
      </div>
    </div>
