<!-- Forcast ................................. -->
<div class="forecast">
  <div class="container">
    <div class="today">
      <h5>{{'Hourly Forecast' | translate}}</h5>
    </div>
    <div class="hourly-wrapper">
       <div class="fore_boxs hourly_swiper swiper" id="hourlyData">
    <div class="swiper-wrapper">
        <div
        class="forecast_box swiper-slide"
        *ngFor="let item of hourlyData;let index=index"
        [ngStyle]="{ background: item.gradient }"
      >
        <p class="date">{{dataService.getToOrderDate(item.toorder)}}</p>
        <p>{{ index==0?'Now': item.ist }}</p>
        <img [src]="item.iconImage" alt="" />
        <div class="temp">{{ item.temp_max }}°</div>
      </div>
      </div>
    </div>
    <div class="hours" (click)="gotoForecastPage(24)">
      <img src="./img/view_24.png" alt="">
      <div class="txt">
        {{'View 24 hour forecast' | translate}}.
      </div>
    </div>
    </div>
    <div class="btn_center" (click)="gotoForecastPage(7)">
      <div class="btn">
        <button>{{'View 7 days forecast' | translate}}</button>
      </div>
    </div>
  </div>
</div>

<!-- Adds -->
<div class="adds">
  <div class="container">
    <div class="Advertisement">
      <h5>{{'Advertisement' | translate}}</h5>
    </div>
  </div>
</div>
