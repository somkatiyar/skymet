<div class="forCastMap">
  <div class="container">


    <div class="tabs">
      <button class="tab" [ngClass]="{'active': selectedTab === 'himawari'}"
        (click)="getsatelliteImage('himawari')">{{'Himawari' | translate}}</button>
      <button class="tab" [ngClass]="{'active': selectedTab === 'insat'}" (click)="getsatelliteImage('insat')">{{'Insat'
        | translate}}</button>
    </div>

    <div class="textContent">
      <div class="textMain">
                {{'Showing result from' | translate}} <span>{{getDateAndTime('date')}}</span> -
        <span>{{getDateAndTime('time')}}</span>

        <!-- {{'Showing result from' | translate}} <span>{{satelliteImages && satelliteImages[activeIndex]?.date}}</span> -
        <span>{{satelliteImages && satelliteImages[activeIndex]?.time}}</span> -->
      </div>
    </div>

    <div class="mainMap">
      <div class="topbuttons">
        <div class="cards">
          <div class="buttons">
            <button class="button" (click)="viewType='swiper';refreshTab()"
              [ngClass]="{'active': viewType === 'swiper'}">
              <img src="https://www.skymetweather.com/img/map.svg" alt="" />
            </button>
            <button class="button" (click)="viewType='grid';refreshTab()" [ngClass]="{'active': viewType === 'grid'}">
              <img src="https://www.skymetweather.com/img/menu4.svg" alt="" />
            </button>
          </div>
        </div>

        <!-- <div class="contentCenter" *ngIf="viewType === 'swiper'">
          <p>{{satelliteImages[activeIndex]?.date}}</p>
        </div> -->

        <div class="cards thirdButtonGroup">
          <div class="buttons singleButton">
            <button class="button" (click)="openFullscreen()">
              <img src="https://www.skymetweather.com/img/expend.svg" alt="" />
            </button>
          </div>
          <div class="buttons singleButton">
            <button class="button" (click)="viewType=='swiper'? whatsappImageShare() : shareFiles()">
              <img src="https://www.skymetweather.com/img/whatsapp.svg" alt="" />
            </button>
          </div>
          <div class="buttons multiButton" *ngIf="viewType === 'swiper'">
            <button class="button" (click)="zoomOut()">
              <img src="https://www.skymetweather.com/img/minus.svg" alt="" />
            </button>
            <button class="button" (click)="zoomIn()">
              <img src="https://www.skymetweather.com/img/plus.svg" alt="" />
            </button>
          </div>
        </div>
      </div>



      <div *ngIf="viewType=='swiper'">
        <div style="--swiper-navigation-color: #fff; --swiper-pagination-color: #fff" class="swiper mySwiper2">
          <div class="swiper-wrapper">
            <div class="swiper-slide swiper-slider-item" *ngFor="let item of satelliteImages;let i = index">
              <img [src]="item.image" [title]="'Satellite View: ' + item.time + ' IST'" width="800" height="600"
                loading="eager" [alt]="getImageAltText(item)" id="img{{i}}"
                [ngStyle]="{'object-fit': (selectedTab === 'insat' || selectedTab === 'himawari') ?  'cover' : 'contain',}" />
            </div>
          </div>
          <div class="swiper-button-next">
            <img src="https://www.skymetweather.com/img/rightArrow.svg" alt="" />
          </div>
          <div class="swiper-button-prev">
            <img src="https://www.skymetweather.com/img/leftArrow.svg" alt="" />
          </div>
        </div>
        <div thumbsSlider="" class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide swiper-slider-thumb" *ngFor="let item of satelliteImages">
              <h5>{{item.time}}</h5>
              <img [src]="item.image" [title]="'Satellite View: ' + item.time + ' IST'" width="800" height="600"
                loading="eager" [alt]="getImageAltText(item)" />
            </div>

          </div>
        </div>
      </div>
      <div *ngIf="viewType=='grid'">
        <div class="gridContainer" id="gridContainer">
          <div *ngFor="let item of satelliteImages" (click)="toggleImageSelection(item.image)">
            <h6>{{item.time}}</h6>
            <img [src]="item.image" [title]="'Satellite View: ' + item.time + ' IST'" width="800" height="600"
              loading="eager" [class.selected]="isSelected(item.image)" [alt]="getImageAltText(item)" />

          </div>
        </div>
      </div>
    </div>
    <div appAdsense class="adsense_web" *ngIf="this.nativeService.getPlateform() == 'web'"
      [adClient]="'ca-pub-6993696142089445'" [adSlot]="'9187952748'">
    </div>

    <app-weather-news [weatherNewsHeaderConfig]="weatherNewsHeaderConfig"></app-weather-news>
    <div appAdsense class="adsense_web" *ngIf="this.nativeService.getPlateform() == 'web'"
      [adClient]="'ca-pub-6993696142089445'" [adSlot]="'9187952748'">
    </div>
      
  </div>
</div>
